<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ProFolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <div class="flex justify-center mb-6">
            <div
                class="logo-icon bg-blue-600 text-white font-bold w-12 h-12 rounded-lg flex items-center justify-center text-xl">
                P</div>
        </div>
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-8">Welcome Back</h2>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            {% if form.errors %}
            <div class="p-3 bg-red-100 text-red-700 text-sm rounded border border-red-200">Invalid username or password.
            </div>
            {% endif %}

            <div class="space-y-4">
                {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                    <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition">Log
                In</button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account? <a href="{% url 'signup' %}" class="text-blue-600 font-medium hover:underline">Sign
                up</a>
        </p>
    </div>

    <script>
        // Style standard Django form inputs with Tailwind
        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll('input').forEach(input => {
                if (input.type !== 'submit' && input.type !== 'hidden') {
                    input.classList.add('w-full', 'border', 'border-gray-300', 'rounded-lg', 'p-2.5', 'focus:ring-2', 'focus:ring-blue-500', 'focus:border-blue-500', 'transition');
                }
            });
        });
    </script>
</body>

</html>
